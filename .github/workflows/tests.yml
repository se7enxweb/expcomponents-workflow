name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bz2, dom, gd, iconv, mbstring, pdo_sqlite, posix, sqlite3, xml, zlib
          ini-values: error_reporting=-1, display_errors=On, zend.assertions=1
          coverage: none

      - name: Lint every source file
        run: |
          status=0
          for file in $(find src -name '*.php'); do
            php -l "$file" >/dev/null || status=1
          done
          exit $status

      - name: Use sibling forks without a Packagist release from GitHub
        # Changes only this checkout's composer.json, and only for a fork that has
        # no release on Packagist yet; released forks resolve as users get them.
        run: |
          todo=$(jq -r '((.require // {}) + (."require-dev" // {})) | keys[] | select(startswith("se7enxweb/expcomponents-"))' composer.json)
          seen=" "
          while [ -n "$(echo $todo)" ]; do
            set -- $todo; pkg=$1; shift; todo="$*"
            case "$seen" in *" $pkg "*) continue ;; esac
            seen="$seen$pkg "
            name=${pkg#se7enxweb/}
            if curl -sf -o /dev/null "https://repo.packagist.org/p2/$pkg.json"; then
              echo "$pkg: released on Packagist"
            else
              url="https://github.com/se7enxweb/$name"
              ver=$(git ls-remote --tags --refs "$url" | sed 's#.*refs/tags/##' | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)
              echo "$pkg: no release on Packagist yet, using dev-master of $url as $ver"
              composer config "repositories.$name" "{\"type\": \"vcs\", \"url\": \"$url\", \"no-api\": true}"
              composer require --no-update --no-interaction "$pkg:dev-master as $ver"
            fi
            todo="$todo $(curl -sf "https://raw.githubusercontent.com/se7enxweb/$name/HEAD/composer.json" | jq -r '(.require // {}) | keys[] | select(startswith("se7enxweb/expcomponents-"))')"
          done

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run the test suite
        run: vendor/bin/phpunit
